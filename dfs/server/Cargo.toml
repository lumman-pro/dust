[package]
name = "dfs-api"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "dfs-api"

[[bin]]
name = "elasticsearch_create_index"
path = "bin/elasticsearch/create_index.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
dfs-protocol = { path = "../protocol" }
elasticsearch = "8.15.0-alpha.1"
foundationdb = { version = "=0.11.0", default-features = false, features = ["fdb-7_3", "embedded-fdb-include"] }
futures = "0.3"
lru = "0.18"
mime = "0.3"
prost = "0.14"
ring = "0.17"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14"
tonic-health = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "test-util"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
expect_used = "deny"
unwrap_used = "deny"
